name: Linux infrastructure | Static and integration tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Préparer Ansible et les dépendances des tests
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'ansible-core>=2.21,<2.22' -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Tests statiques et syntaxe
        run: |
          set -Eeuo pipefail
          for file in scripts/*.sh docker/ubuntu-host/entrypoint.sh; do bash -n "$file"; done
          python3 -m unittest discover -s tests -v
          ansible-playbook --syntax-check -i ansible/inventory.ini ansible/site.yml

      - name: Initialiser les clés et vérifier Docker Compose
        run: |
          bash scripts/lab.sh init
          docker compose config --quiet

      - name: Construire et démarrer tous les services
        run: bash scripts/lab.sh up

      - name: Déployer la configuration Ansible
        run: bash scripts/lab.sh provision

      - name: Vérifier l'idempotence Ansible
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/lab.sh provision | tee "$RUNNER_TEMP/ansible-idempotence.log"
          python3 - "$RUNNER_TEMP/ansible-idempotence.log" <<'PY'
          import re, sys
          s=open(sys.argv[1], encoding='utf-8').read()
          for hostname in ('web1', 'backup1'):
              assert re.search(rf'(?m)^{hostname}\s+:.*changed=0', s), f'Idempotence non démontrée sur {hostname}'
          print('[OK] Les deux hôtes ne sont pas modifiés à la deuxième exécution')
          PY

      - name: Vérifier SSH, HTTP, exporters, API Grafana et règles d'alerte
        run: bash scripts/lab.sh test

      - name: Sauvegarder, restaurer et revalider
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/lab.sh backup | tee "$RUNNER_TEMP/backup.log"
          ID="$(grep -oE 'snapshot-[0-9]{8}T[0-9]{6}Z-[0-9]+' "$RUNNER_TEMP/backup.log" | head -1)"
          test -n "$ID"
          bash scripts/lab.sh restore "$ID"
          bash scripts/lab.sh test

      - name: Simuler une panne, confirmer l'alerte, restaurer le service
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'bash scripts/lab.sh recover || true' EXIT
          bash scripts/lab.sh incident
          python3 scripts/check_alert.py --state firing --timeout 100
          bash scripts/lab.sh recover
          python3 scripts/check_alert.py --state resolved --timeout 100
          bash scripts/lab.sh test
          trap - EXIT

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --no-color --tail 150 || true

      - name: Nettoyer les conteneurs
        if: always()
        run: docker compose down || true
