name: linux-infra-lab

x-linux-host: &linux-host
  build:
    context: ./docker/ubuntu-host
  restart: unless-stopped
  volumes:
    - ./.secrets/id_ed25519.pub:/run/lab/authorized_key.pub:ro
  networks: [lab]

services:
  web:
    <<: *linux-host
    hostname: web
    ports:
      - "127.0.0.1:2221:22"
      - "127.0.0.1:8088:80"
  backup:
    <<: *linux-host
    hostname: backup
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ./.secrets/id_ed25519.pub:/run/lab/authorized_key.pub:ro
      - backup_data:/srv/lab-backups
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [lab]
    depends_on: [web, backup, blackbox, alertmanager]
  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [lab]
  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["127.0.0.1:9093:9093"]
    networks: [lab]
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Exécuter bash scripts/lab.sh init}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [lab]
    depends_on: [prometheus]

networks:
  lab:
    driver: bridge
volumes:
  backup_data:
  grafana_data:
  prometheus_data:
